# The Secret that Rancher reads its client secret from. The chart creates the
# Secret without data, and the job fills it. Helm never changes the data on
# an upgrade, because the chart does not set any data. The Secret stays when
# the chart is removed, because Rancher may still use it.
apiVersion: v1
kind: Secret
metadata:
  name: azureadconfig-applicationsecret
  namespace: cattle-global-data
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
