apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: {{ required "rotatorClientId is required" .Values.rotatorClientId | quote }}
    azure.workload.identity/tenant-id: {{ required "tenantId is required" .Values.tenantId | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Release.Namespace }}
data:
  rotate.sh: |
{{- /* Remove carriage returns: busybox sh stops on CRLF line endings. */}}
{{ .Files.Get "files/rotate.sh" | replace "\r" "" | indent 4 }}
