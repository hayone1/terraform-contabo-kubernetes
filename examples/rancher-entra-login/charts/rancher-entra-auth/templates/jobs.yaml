apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-rotate
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        {{- include "rancher-entra-auth.pod" . | nindent 8 }}
---
# Runs after every install and upgrade of the chart. Terraform therefore only
# reports success when Rancher has a working secret and the Entra ID login is
# on.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-apply
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    {{- include "rancher-entra-auth.pod" . | nindent 4 }}
